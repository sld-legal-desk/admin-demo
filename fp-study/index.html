<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FP合格ナビ — FP技能検定 学習アプリ</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  // @babel/standalone の現行版は preset-react の JSX 自動ランタイム
  // (import "react/jsx-runtime") を既定とするため、UMD の React グローバルを
  // 使う本構成では「Cannot use import statement」で描画できなくなる。
  // クラシックランタイムを使うプリセットを登録し、script タグで明示指定する。
  Babel.registerPreset("react-classic", {
    presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
  });
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; -webkit-font-smoothing: antialiased; }
  button:focus-visible { outline: 2px solid #1a8f5e; outline-offset: 2px; }
  /* レスポンシブ：スマホでは下部ナビ表示・グリッド1列 */
  @media (max-width: 680px) {
    .fp-desk-nav { display: none !important; }
    .fp-mobile-nav { display: flex !important; }
    .fp-stat-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="./questions.js"></script>
<script type="text/babel" data-presets="react-classic" src="./app.jsx"></script>
</body>
</html>
